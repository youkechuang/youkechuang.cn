log_format youkechuang_main '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" '
    '"$http_cf_connecting_ip" "$http_cf_ipcountry" "$http_x_forwarded_for"';

# ---- gzip compression ----
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_disable "msie6";
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/wasm
    image/svg+xml;

# ---- cache policy: expires time per request (matched by URI) ----
# First matching regex wins; default is no cache header.
map $request_uri $expires_time {
    default                                          "-1";
    ~^/_analytics/                                   "off";
    ~^/admin/                                        "off";
    ~^/homeinventory-api/                            "off";
    ~*\.html$                                        "-1";
    ~*@[0-9]+\.[0-9]+\.[0-9]+/.*\.(css|js|mjs)$      "1y";
    ~*\.(woff2?|ttf|otf|eot)$                        "1y";
    ~*\.(css|js|mjs)$                                "30d";
    ~*\.(png|jpe?g|gif|webp|svg|ico|avif)$           "30d";
    ~*\.(json|xml|geojson)$                          "1h";
}

server {
    listen 80;
    server_name youkechuang.cn www.youkechuang.cn _;

    root /usr/share/nginx/html;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://youkechuang.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name youkechuang.cn www.youkechuang.cn _;

    root /usr/share/nginx/html;
    index index.html;

    # 带 ?v= 版本号的静态资源：30 天缓存（V10 缓存策略）
    location ~* \.\w+\?v= {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    ssl_certificate /etc/letsencrypt/live/youkechuang.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youkechuang.cn/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/youkechuang.access.log youkechuang_main;
    error_log /var/log/nginx/youkechuang.error.log warn;

    # ---- security headers (applied to all responses incl. proxied) ----
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- real 404s: missing paths return 404 status + 404.html body ----
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
        expires $expires_time;
    }

    location /_analytics/ {
        alias /usr/share/nginx/analytics/;
        index index.html;
        try_files $uri $uri/ =404;
        expires -1;
    }

    location /homeinventory-api/ {
        proxy_pass http://host.docker.internal:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        expires -1;
    }

    location /admin/ {
        proxy_pass http://host.docker.internal:9000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
        expires -1;
    }
}
