site:
  domain: https://youkechuang.cn
  title: 尤科闯的官方网站
  description: 尤科闯的个人网站，记录长期写作、人生经历、产品思考，以及边学边做的地图和效率工具。
  keywords: 尤科闯, youkechuang, 个人博客, 人生记录, 产品思考, 学习工具, 地图学习, 效率工具
  theme: default
  language: zh-CN
  # set the /<rootPath> pathname under which your site is served
  # for GitHub pages deployment without a custom domain, it is often '/<projectName>'
  # root-path: /gitsite
  # set cdn prefix: self hosted
  cdn-path: /static
  navigation:
    - title: 我的1/3人生
      uri: /books/onethird/index.html
    - title: 博客
      uri: /blogs/all/index.html
    - title: 地图
      uri: /static/maphub/index.html
    - title: 人生足迹
      uri: /static/life-journey/index.html
    - title: 15分钟记录
      uri: /static/focus/index.html
    - title: 创业专题
      uri: /static/startup/index.html
    - title: 文档
      uri: /static/docs/product.html
  git:
    base-url: https://github.com/youkechuang/youkechuang.cn/blob/main/source
  contact:
    name: George You
    github: https://github.com/youkechuang/youkechuang.cn
    twitter: https://twitter.com/GeorgeYoukc
  books:
    index-marker: true
  search:
    # none = no search
    # browser = flex search in browser
    # google = google site search
    type: browser
  # control styles:
  styles:
    # show 'Edit in Git':
    display-git-link: false
    # any custom styles used in theme:
    # code-font: Monaco
  integration:
    comment:
      provider: disqus
      # 请将下面的 'your-disqus-shortname' 替换为你在 Disqus 注册的短名称
      # 注册地址: https://disqus.com/profile/signup/
      # 创建站点后，在设置中可以看到你的 shortname
      name: kechuangyou
    analytics:
      # provider: goatcounter
      # GoatCounter 站点代码
      # 获取方式：
      # 1. 访问 https://www.goatcounter.com/ 注册账号（免费）
      # 2. 创建新站点，填写你的网站域名
      # 3. 复制站点代码（site code），格式类似：your-site-name
      # 4. 将下面的 'your-site-code' 替换为你的实际站点代码
      code: kechuangyou
  footer: |
          <div>
            &copy;<a href="/">youkechuang.cn</a> 
            - <a href="https://weibo.com/youkc" target="_blank">微博</a>
            - <a href="https://github.com/youkechuang/youkechuang.cn" target="_blank" rel="noopener noreferrer">GitHub</a>
            - <a href="/pages/license/index.html" target="_blank">License</a>
          </div>


build:
  # copy special files under root dir (ignore if not found):
  copy:
    - favicon.ico
    - robots.txt
    - sitemap.xml
    - ads.txt

# you can add any items:
