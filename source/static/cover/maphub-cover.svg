<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="55%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- decorative grid (upper area, stays visible in crop) -->
  <g stroke="#ffffff" stroke-opacity="0.13" stroke-width="1">
    <path d="M 0 90 H 800 M 0 180 H 800 M 0 270 H 800 M 0 360 H 800"/>
    <path d="M 133 0 V 450 M 266 0 V 450 M 400 0 V 450 M 533 0 V 450 M 666 0 V 450"/>
  </g>

  <!-- map pin -->
  <g transform="translate(190,200)">
    <path d="M 0 -85 C 41 -85 66 -53 66 -22 C 66 22 24 63 0 85 C -24 63 -66 22 -66 -22 C -66 -53 -41 -85 0 -85 Z"
          fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="0" cy="-22" r="29" fill="#0e7490"/>
    <circle cx="0" cy="-22" r="12" fill="#ffffff"/>
  </g>

  <!-- route dots -->
  <g fill="#ffffff" fill-opacity="0.75">
    <circle cx="360" cy="110" r="7"/>
    <circle cx="430" cy="180" r="9"/>
    <circle cx="500" cy="250" r="7"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 360 110 C 390 140 410 158 430 180 C 455 207 475 230 500 250"/>
  </g>

  <!-- text -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="590" y="160" font-size="40" font-weight="800" fill="#ffffff">省份地图游戏</text>
    <text x="590" y="212" font-size="20" fill="#d1fae5">预习 · 每日挑战 · 错题复习</text>
    <text x="590" y="250" font-size="17" fill="#a7f3d0" fill-opacity="0.9">记住中国省级行政区</text>
  </g>
</svg>
