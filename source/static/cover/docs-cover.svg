<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- document pages -->
  <g transform="translate(125,95)">
    <rect x="0" y="0" width="85" height="115" rx="9" fill="#ffffff" fill-opacity="0.28"/>
    <rect x="22" y="22" width="145" height="170" rx="9" fill="#ffffff" fill-opacity="0.95"/>
    <g stroke="#0369a1" stroke-width="7" stroke-linecap="round">
      <line x1="46" y1="55" x2="143" y2="55"/>
      <line x1="46" y1="85" x2="143" y2="85"/>
      <line x1="46" y1="115" x2="117" y2="115"/>
    </g>
    <circle cx="170" cy="42" r="17" fill="#0e7490"/>
    <path d="M 163 42 L 169 50 L 178 33" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- small doc -->
  <g transform="translate(340,110)">
    <rect x="0" y="0" width="56" height="76" rx="7" fill="#ffffff" fill-opacity="0.45"/>
    <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round">
      <line x1="12" y1="28" x2="44" y2="28"/>
      <line x1="12" y1="50" x2="36" y2="50"/>
    </g>
  </g>

  <!-- text -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="590" y="160" font-size="40" font-weight="800" fill="#ffffff">网站产品文档</text>
    <text x="590" y="212" font-size="20" fill="#cffafe">定位 · 功能模块 · 部署流程</text>
    <text x="590" y="250" font-size="17" fill="#a5f3fc" fill-opacity="0.9">和后续规划</text>
  </g>
</svg>
